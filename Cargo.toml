[package]
name = "rs_agent_router"
version = "0.6.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cli-stream = { path = "../agent-harness/crates/cli-stream" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tray-icon = "0.21"
raw-window-handle = "0.6"
tiny_http = "0.12"
uuid = { version = "1.24", features = ["v4"] }
webbrowser = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1.31"
